<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 변경 — Prointerz</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">Prointerz</div>
      <div style="font-size:15px;font-weight:700;color:#111827;margin-bottom:6px;">비밀번호를 변경해 주세요</div>
      <div style="font-size:13px;color:#6b7280;line-height:1.6;margin-bottom:18px;">
        보안 강화를 위해 비밀번호는 <b>{{ min_len }}자 이상</b>이어야 합니다.<br>
        {{ session.get('username') }}님의 현재 비밀번호가 {{ min_len }}자보다 짧아, 변경 후 이용할 수 있습니다.
      </div>
      <form method="POST" action="/password/required">
        <div class="form-group" style="margin-bottom:14px;">
          <label>새 비밀번호 ({{ min_len }}자 이상)</label>
          <input type="password" name="new_password" minlength="{{ min_len }}" required autofocus autocomplete="new-password">
        </div>
        <div class="form-group" style="margin-bottom:18px;">
          <label>새 비밀번호 확인</label>
          <input type="password" name="confirm_password" minlength="{{ min_len }}" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">변경하고 시작하기</button>
        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}
        <div style="text-align:center;margin-top:14px;"><a href="/logout" style="font-size:12px;color:#9ca3af;">로그아웃</a></div>
      </form>
    </div>
  </div>
</body>
</html>
