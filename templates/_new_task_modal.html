{# 제작부문 새 과업(수의계약) 등록 모달 — 공용 #}
<!-- 새 과업 생성 모달 -->
<div id="createTaskModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                                   background: rgba(0,0,0,0.5); z-index: 1000;
                                   align-items: center; justify-content: center;">
  <div style="background: #fff; border-radius: 12px; padding: 32px; max-width: 500px; width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #1f2937;">새 과업 생성</h2>

    <form id="createTaskForm" style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label style="display: block; font-size: 13px; font-weight: 700; color: #1f2937; margin-bottom: 8px;">
          사업명 <span style="color: #ef4444;">*</span>
        </label>
        <input type="text" id="project_name" name="project_name" required
               placeholder="예: 2024년 한국관광공사 홍보영상 제작"
               style="width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
                      font-size: 13px; box-sizing: border-box;">
      </div>

      <div>
        <label style="display: block; font-size: 13px; font-weight: 700; color: #1f2937; margin-bottom: 8px;">
          발주처 <span style="color: #ef4444;">*</span>
        </label>
        <input type="text" id="client_name" name="client_name" required
               placeholder="예: 한국관광공사"
               style="width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
                      font-size: 13px; box-sizing: border-box;">
      </div>

      <div>
        <label style="display: block; font-size: 13px; font-weight: 700; color: #1f2937; margin-bottom: 8px;">
          공고명
        </label>
        <input type="text" id="bid_ntce_nm" name="bid_ntce_nm"
               placeholder="예: 2024년 한국관광공사 홍보영상 제작 공고"
               style="width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
                      font-size: 13px; box-sizing: border-box;">
      </div>

      <div>
        <label style="display: block; font-size: 13px; font-weight: 700; color: #1f2937; margin-bottom: 8px;">
          비고
        </label>
        <textarea id="notes" name="notes" placeholder="추가 설명 (선택사항)"
                  style="width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
                         font-size: 13px; box-sizing: border-box; min-height: 80px; resize: vertical;"></textarea>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 20px;">
        <button type="submit" style="flex: 1; padding: 10px 20px; background: #4f46e5; color: #fff;
                                      border: none; border-radius: 8px; font-size: 14px;
                                      font-weight: 600; cursor: pointer;">
          생성
        </button>
        <button type="button" onclick="closeCreateTaskModal()" style="flex: 1; padding: 10px 20px;
                                                                       background: #f3f4f6; color: #6b7280;
                                                                       border: none; border-radius: 8px; font-size: 14px;
                                                                       font-weight: 600; cursor: pointer;">
          취소
        </button>
      </div>
    </form>
  </div>
</div>

<script>
function openCreateTaskModal() {
  document.getElementById('createTaskModal').style.display = 'flex';
}

function closeCreateTaskModal() {
  document.getElementById('createTaskModal').style.display = 'none';
  document.getElementById('createTaskForm').reset();
}

// 모달 외부 클릭 시 닫기
document.addEventListener('click', function(event) {
  const modal = document.getElementById('createTaskModal');
  if (event.target === modal) {
    closeCreateTaskModal();
  }
});

// 폼 제출
document.getElementById('createTaskForm')?.addEventListener('submit', async function(e) {
  e.preventDefault();

  const formData = new FormData(this);

  try {
    const response = await fetch('/production/tasks/create', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        project_name: formData.get('project_name'),
        client_name: formData.get('client_name'),
        bid_ntce_nm: formData.get('bid_ntce_nm'),
        notes: formData.get('notes')
      })
    });

    const result = await response.json();

    if (result.ok) {
      closeCreateTaskModal();
      location.href = '/production/tasks/' + result.task_id;   // 만든 과업 화면으로 이동
    } else {
      alert('오류: ' + (result.error || '알 수 없는 오류'));
    }
  } catch (err) {
    alert('오류: ' + err.message);
  }
});

document.addEventListener('DOMContentLoaded', function(){
  // 초기화 로직 (필요시)
});
</script>
